<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رقيب الخزنة الذكي - Vault Pro 2026</title>
    <!-- Tailwind CSS & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js & Tesseract.js (OCR) -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    
    <!-- Google Fonts (Tajawal) -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'Tajawal', sans-serif; background-color: #0b132b; color: #e0e1dd; }
        .gold-border { border: 1px solid #d4af37; }
        .gold-text { color: #d4af37; }
        .luxury-card { background: linear-gradient(145deg, #1c2541, #0b132b); border: 1px solid #3a506b; }
        .active-tab { background: #10b981; color: #0b132b; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen">

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    function App() {
        const [activeTab, setActiveTab] = useState('input');
        const [auth, setAuth] = useState(false);
        const [passCode, setPassCode] = useState('');

        // Data States
        const [systemSales, setSystemSales] = useState(0);
        const [cashActual, setCashActual] = useState(0);
        const [instapay, setInstapay] = useState(0);
        const [expenses, setExpenses] = useState(0);
        const [wastage, setWastage] = useState(0);
        const [allowedWastage, setAllowedWastage] = useState(100);
        const [ocrText, setOcrText] = useState('');
        const [loadingOcr, setLoadingOcr] = useState(false);

        const chartRef = useRef(null);
        const chartInstance = useRef(null);

        // Calculate Deficit & Net Profit
        const totalCollected = Number(cashActual) + Number(instapay);
        const netCalculated = Number(systemSales) - Number(expenses) - Number(wastage);
        const deficit = Number(systemSales) - totalCollected;
        const isWastageExceeded = Number(wastage) > Number(allowedWastage);

        // Chart Setup
        useEffect(() => {
            if (activeTab === 'reports' && chartRef.current) {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'doughnut',
                    data: {
                        labels: ['الكاش الفعلي', 'InstaPay/فيزا', 'المصاريف والخدمات', 'العجز والفرق'],
                        datasets: [{
                            data: [cashActual, instapay, expenses, deficit > 0 ? deficit : 0],
                            backgroundColor: ['#10b981', '#3b82f6', '#f59e0b', '#ef4444']
                        }]
                    },
                    options: { plugins: { legend: { labels: { color: '#ffffff' } } } }
                });
            }
        }, [activeTab, cashActual, instapay, expenses, deficit]);

        // OCR Handler
        const handleOcr = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            setLoadingOcr(true);
            Tesseract.recognize(file, 'ara+eng').then(({ data: { text } }) => {
                setOcrText(text);
                setLoadingOcr(false);
            });
        };

        if (!auth) {
            return (
                <div className="flex items-center justify-center min-h-screen px-4">
                    <div className="luxury-card p-8 rounded-2xl max-w-md w-full text-center shadow-2xl border-2 border-amber-500/30">
                        <div className="w-20 h-20 bg-emerald-500/10 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500">
                            <i data-lucide="shield-check" className="w-10 h-10 text-emerald-400"></i>
                        </div>
                        <h1 className="text-3xl font-black gold-text mb-2">رقيب الخزنة الذكي</h1>
                        <p className="text-sm text-slate-400 mb-6">منظومة كشف التسريب والعجز والربح المستقل V2026</p>
                        <input 
                            type="password" 
                            placeholder="أدخل كود التفعيل الخص بالمنشأة"
                            className="w-full p-3 rounded-lg bg-slate-900 border border-slate-700 text-center mb-4 focus:border-emerald-500 outline-none text-white"
                            value={passCode}
                            onChange={(e) => setPassCode(e.target.value)}
                        />
                        <button 
                            onClick={() => (passCode === '2026' || passCode === 'VAULT-PRO-2026') ? setAuth(true) : alert('كود تفعيل غير صحيح')}
                            className="w-full py-3 bg-gradient-to-r from-emerald-500 to-teal-600 text-slate-950 font-bold rounded-lg shadow-lg hover:brightness-110 transition"
                        >
                            دخول النظام الفاخر 🔓
                        </button>
                    </div>
                </div>
            );
        }

        return (
            <div className="max-w-6xl mx-auto p-4 md:p-6 space-y-6">
                {/* Header */}
                <header className="flex flex-col md:flex-row justify-between items-center luxury-card p-6 rounded-2xl border-b-2 border-emerald-500 shadow-xl">
                    <div className="flex items-center space-x-4 space-x-reverse mb-4 md:mb-0">
                        <div className="p-3 bg-emerald-500/20 rounded-xl border border-emerald-500">
                            <i data-lucide="vault" className="w-8 h-8 text-emerald-400"></i>
                        </div>
                        <div>
                            <h1 className="text-2xl font-black gold-text">رقيب الخزنة - Vault Pro</h1>
                            <p className="text-xs text-slate-400">لوحة التحكم المالية الاحترافية للمحلات والمتاجر</p>
                        </div>
                    </div>

                    {/* Navigation Tabs */}
                    <div className="flex bg-slate-900 p-1.5 rounded-xl border border-slate-700">
                        <button onClick={() => setActiveTab('input')} className={`px-4 py-2 rounded-lg text-sm transition ${activeTab === 'input' ? 'active-tab' : 'text-slate-300'}`}>📥 مدخل البيانات</button>
                        <button onClick={() => setActiveTab('engines')} className={`px-4 py-2 rounded-lg text-sm transition ${activeTab === 'engines' ? 'active-tab' : 'text-slate-300'}`}>🧮 مركز الحاسبات</button>
                        <button onClick={() => setActiveTab('reports')} className={`px-4 py-2 rounded-lg text-sm transition ${activeTab === 'reports' ? 'active-tab' : 'text-slate-300'}`}>📊 التقرير والمكسب</button>
                    </div>
                </header>

                {/* Main Content Area */}
                <main>
                    {/* TAB 1: Multi-Input Hub */}
                    {activeTab === 'input' && (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="luxury-card p-6 rounded-2xl space-y-4">
                                <h3 className="text-lg font-bold text-emerald-400 flex items-center gap-2">
                                    <i data-lucide="scan"></i> ماسح التقارير والأوراق (AI Scanner)
                                </h3>
                                <p className="text-xs text-slate-400">ارفع صورة التقرير اليومي بخط اليد أو السيستم لاستخراج البيانات تلقائياً</p>
                                <input type="file" onChange={handleOcr} className="w-full p-2 bg-slate-900 border border-slate-700 rounded-lg text-sm text-slate-300" />
                                {loadingOcr && <p className="text-amber-400 text-xs animate-pulse">جاري تحليل الورقة بالذكاء الاصطناعي...</p>}
                                {ocrText && (
                                    <div className="p-3 bg-slate-900/80 rounded-lg border border-slate-700 text-xs max-h-32 overflow-y-auto text-emerald-300">
                                        <strong>النص المستخرج:</strong> {ocrText}
                                    </div>
                                )}
                            </div>

                            <div className="luxury-card p-6 rounded-2xl space-y-4">
                                <h3 className="text-lg font-bold text-blue-400 flex items-center gap-2">
                                    <i data-lucide="file-spreadsheet"></i> مستورد الجداول (Excel/CSV)
                                </h3>
                                <p className="text-xs text-slate-400">رفع شيت كاشير المحل مباشرة لتغذية الخزنة بالأرقام</p>
                                <div className="border-2 border-dashed border-slate-700 p-8 rounded-xl text-center hover:border-blue-500 transition cursor-pointer">
                                    <i data-lucide="upload-cloud" className="w-10 h-10 text-slate-500 mx-auto mb-2"></i>
                                    <span className="text-xs text-slate-400">اضغط لرفع ملف Excel أو CSV</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* TAB 2: Smart Calculations Engine */}
                    {activeTab === 'engines' && (
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                            <div className="luxury-card p-6 rounded-2xl space-y-4 md:col-span-2">
                                <h3 className="text-lg font-bold gold-text flex items-center gap-2">
                                    <i data-lucide="calculator"></i> مدخلات الخزنة والورديات
                                </h3>
                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                    <div>
                                        <label className="text-xs text-slate-400">إجمالي مبيعات السيستم/الدفتر</label>
                                        <input type="number" value={systemSales} onChange={e => setSystemSales(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white mt-1" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400">الكاش الفعلي في الخزنة</label>
                                        <input type="number" value={cashActual} onChange={e => setCashActual(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white mt-1" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400">مدفوعات الفيزا و InstaPay</label>
                                        <input type="number" value={instapay} onChange={e => setInstapay(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white mt-1" />
                                    </div>
                                    <div>
                                        <label className="text-xs text-slate-400">المصاريف اليومية وأجور العمال</label>
                                        <input type="number" value={expenses} onChange={e => setExpenses(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white mt-1" />
                                    </div>
                                </div>
                            </div>

                            {/* Wastage Margin Monitor */}
                            <div className="luxury-card p-6 rounded-2xl space-y-4">
                                <h3 className="text-lg font-bold text-amber-400 flex items-center gap-2">
                                    <i data-lucide="alert-triangle"></i> حاسبة الهالك والحد المسموح
                                </h3>
                                <div>
                                    <label className="text-xs text-slate-400">قيمة الهالك اليومي (ج.م)</label>
                                    <input type="number" value={wastage} onChange={e => setWastage(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white mt-1" />
                                </div>
                                <div>
                                    <label className="text-xs text-slate-400">الحد الأقصى المسموح للهالك</label>
                                    <input type="number" value={allowedWastage} onChange={e => setAllowedWastage(e.target.value)} className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-white mt-1" />
                                </div>

                                {isWastageExceeded && (
                                    <div className="p-3 bg-red-500/20 border border-red-500 rounded-lg text-red-400 text-xs font-bold animate-bounce flex items-center gap-2">
                                        <i data-lucide="bell-ring"></i> تحذير: الهالك تجاوز الحد المسموح!
                                    </div>
                                )}
                            </div>
                        </div>
                    )}

                    {/* TAB 3: Executive Reports */}
                    {activeTab === 'reports' && (
                        <div className="space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                                <div className="luxury-card p-6 rounded-2xl text-center border-t-4 border-red-500">
                                    <span className="text-xs text-slate-400">حالة الخزنة والعجز</span>
                                    <h2 className={`text-3xl font-black mt-2 ${deficit > 0 ? 'text-red-400' : 'text-emerald-400'}`}>
                                        {deficit > 0 ? `عجز: ${deficit} ج.م` : 'الخزنة مظبوطة 100%'}
                                    </h2>
                                </div>

                                <div className="luxury-card p-6 rounded-2xl text-center border-t-4 border-emerald-500">
                                    <span className="text-xs text-slate-400">صافي الأرباح الحقيقية</span>
                                    <h2 className="text-3xl font-black text-emerald-400 mt-2">{netCalculated} ج.م</h2>
                                </div>

                                <div className="luxury-card p-6 rounded-2xl text-center border-t-4 border-blue-500">
                                    <span className="text-xs text-slate-400">إجمالي المتحصلات الكلية</span>
                                    <h2 className="text-3xl font-black text-blue-400 mt-2">{totalCollected} ج.م</h2>
                                </div>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                <div className="luxury-card p-6 rounded-2xl">
                                    <h3 className="text-lg font-bold gold-text mb-4">تحليل تدفق الأموال والنظيف</h3>
                                    <canvas ref={chartRef} className="max-h-64 mx-auto"></canvas>
                                </div>

                                <div className="luxury-card p-6 rounded-2xl flex flex-col justify-between">
                                    <div>
                                        <h3 className="text-lg font-bold text-emerald-400 mb-2">تصدير التقرير التنفيذي</h3>
                                        <p className="text-xs text-slate-400 mb-6">يمكنك طباعة هذا التقرير أو إرساله بصيغة PDF مباشرة للشريك أو صاحب المنشأة.</p>
                                    </div>
                                    <button onClick={() => window.print()} className="w-full py-4 bg-amber-500 text-slate-950 font-black rounded-xl hover:bg-amber-400 transition flex items-center justify-center gap-2">
                                        <i data-lucide="printer"></i> طباعة تقرير PDF المالي
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </main>
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    setTimeout(() => lucide.createIcons(), 500);
</script>

</body>
</html>
