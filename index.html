<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد الفواتير الاحترافي | InvoicePro</title>
    <link rel="manifest" href="/mahref-vault/manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #1e293b;
            --border-color: #e2e8f0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
        }

        .header h1 {
            color: var(--primary);
            margin: 0 0 10px 0;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 700;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-sizing: border-box;
            font-family: inherit;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 16px;
            transition: background 0.3s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .alert-info {
            background-color: #e0e7ff;
            color: #3730a3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container" id="appSection">
    <div class="header">
        <h1><i class="fa-solid fa-file-invoice"></i> InvoicePro</h1>
        <p>أداة إصدار الفواتير الاحترافية الشاملة</p>
    </div>

    <div class="alert-info" id="trialNotice">
        ℹ️ نظام التجربة: لديك 5 فواتير مجانية بالكامل.
    </div>

    <form id="invoiceForm" onsubmit="return false;">
        <div class="form-group">
            <label>اسم العميل / الشركة:</label>
            <input type="text" id="clientName" placeholder="أدخل اسم العميل" required>
        </div>

        <div class="form-group">
            <label>تفاصيل المنتج / الخدمة:</label>
            <textarea id="itemDescription" rows="3" placeholder="تفاصيل الفاتورة..." required></textarea>
        </div>

        <div class="form-group">
            <label>المبلغ الإجمالي (جنيه):</label>
            <input type="number" id="totalAmount" placeholder="0.00" required>
        </div>

        <button type="button" class="btn" id="generateBtn"><i class="fa-solid fa-download"></i> إنشاء وتحميل الفاتورة PDF</button>
    </form>
</div>

<script>
    // تجاوز وحذف أي شاشة تفعيل أولية لضمان عمل الواجهة فوراً
    document.addEventListener('DOMContentLoaded', () => {
        const activationModals = document.querySelectorAll('#activationSection, .activation-modal, #lockScreen, .lock-screen');
        activationModals.forEach(el => el.remove());

        const mainApp = document.getElementById('appSection');
        if (mainApp) mainApp.style.display = 'block';

        updateNotice();
    });

    function updateNotice() {
        const isActivated = localStorage.getItem('invoice_activated') === 'true';
        const noticeEl = document.getElementById('trialNotice');
        
        if (isActivated) {
            if (noticeEl) noticeEl.style.display = 'none';
        } else {
            let usageCount = parseInt(localStorage.getItem('invoice_count')) || 0;
            if (noticeEl) {
                noticeEl.innerText = `ℹ️ النسخة التجريبية: استخدمت (${usageCount} من 5) فواتير مجانية.`;
            }
        }
    }

    // زر إخراج الفاتورة والتحقق من الحد الأقصى (5 مرات)
    document.getElementById('generateBtn').addEventListener('click', function() {
        const isActivated = localStorage.getItem('invoice_activated') === 'true';

        if (!isActivated) {
            let usageCount = parseInt(localStorage.getItem('invoice_count')) || 0;

            if (usageCount >= 5) {
                alert("⚠️ انتهت الفترة المجانية (5 فواتير).\n\nلتفعيل الأداة مدى الحياة بـ 100 جنيه فقط، تواصل معنا عبر الواتساب:\n01153528451");
                return;
            }

            usageCount++;
            localStorage.setItem('invoice_count', usageCount);
            updateNotice();
            alert(`تنبيه: تم إنشاء الفاتورة بنجاح! هذه هي الفاتورة رقم (${usageCount} من 5) في النسخة التجريبية.`);
        } else {
            alert("تم إنشاء الفاتورة بنجاح (حساب مفعل مدى الحياة).");
        }

        // تنفيذ منطق الطباعة أو حفظ الـ PDF
        window.print();
    });
</script>

</body>
</html>
