<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vault Sentinel AI 2026 - المنظومة الشاملة لمكافحة الاختلاس والذكاء المالي</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- React & Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <!-- Google Fonts (Tajawal & Orbitron) -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;900&family=Tajawal:wght@400;600;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        cyber: {
                            bg: '#050811',
                            card: 'rgba(15, 23, 42, 0.75)',
                            gold: '#FFD700',
                            emerald: '#10B981',
                            crimson: '#FF2E93',
                            cyan: '#00F0FF',
                            purple: '#A855F7'
                        }
                    },
                    fontFamily: {
                        tajawal: ['Tajawal', 'sans-serif'],
                        tech: ['Orbitron', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Tajawal', sans-serif; background: #030712; color: #F3F4F6; overflow-x: hidden; }
        .glow-cyan { box-shadow: 0 0 25px rgba(0, 240, 255, 0.25); }
        .glow-gold { box-shadow: 0 0 25px rgba(255, 215, 0, 0.25); }
        .glow-crimson { box-shadow: 0 0 30px rgba(255, 46, 147, 0.35); }
        .glow-emerald { box-shadow: 0 0 25px rgba(16, 185, 129, 0.25); }
        .glass-panel { background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); }
        .cyber-grid { background-image: linear-gradient(to right, rgba(255,255,255,0.03) 1px, transparent 1px), linear-gradient(to bottom, rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 30px 30px; }
        .scanline { position: relative; overflow: hidden; }
        .scanline::before { content: " "; display: block; position: absolute; top: 0; left: 0; bottom: 0; right: 0; background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.03), rgba(0, 255, 0, 0.01), rgba(0, 0, 255, 0.03)); z-index: 20; background-size: 100% 3px, 6px 100%; pointer-events: none; }
        @keyframes radar-pulse { 0% { transform: scale(0.95); opacity: 0.8; } 50% { transform: scale(1.05); opacity: 0.4; } 100% { transform: scale(0.95); opacity: 0.8; } }
        .radar-anim { animation: radar-pulse 3s infinite ease-in-out; }
        .pulse-indicator { animation: radar-pulse 1.5s infinite; }
    </style>
</head>
<body class="cyber-grid min-h-screen">

<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // --- قاعدة بيانات أكواد التفعيل والترخيص المشفرة (تعديل الأكواد من هنا) ---
    const VALID_LICENSES = {
        "VIP-2026-STORE-1": "الفرع الرئيسي - متجر النخبة",
        "OCTOBER-MALL-FRANCHISE": "فرع مول مصر - أكتوبر",
        "TEST-DRIVE-ADMIN": "نسخة تجريبية للمراجعة",
        "MAHMOUD-SENTINEL-99": "محمود فرع أكتوبر"
    };

    function App() {
        const [auth, setAuth] = useState(false);
        const [pinCode, setPinCode] = useState('');
        const [userBranch, setUserBranch] = useState('');
        const [userLicenseKey, setUserLicenseKey] = useState('');
        const [activeTab, setActiveTab] = useState('radar'); // radar, scan, integrations, inputs, shift, analytics

        // Data Models (محاكاة بيانات حقيقية للفئة الكبيرة)
        const [systemSales, setSystemSales] = useState(128500);
        const [cashDrawer, setCashDrawer] = useState(78200);
        const [visaInsta, setVisaInsta] = useState(48800);
        const [expenses, setExpenses] = useState(4200);
        const [rawWastage, setRawWastage] = useState(2950);
        const [allowedWastage, setAllowedWastage] = useState(1100);
        
        // Anti-Fraud AI Indicators (محاكاة ثغرات كاشير محترف)
        const [shiftCashier, setShiftCashier] = useState('أحمد (مدير فرع - وردية مسائية)');
        const [voidCount, setVoidCount] = useState(24);
        const [manualNoSaleOpenCount, setManualNoSaleOpenCount] = useState(18);
        const [suspiciousReturns, setSuspiciousReturns] = useState(8500);

        // Integration States
        const [selectedPos, setSelectedPos] = useState('foodics');
        const [posConnected, setPosConnected] = useState(false);

        const chartRef = useRef(null);
        const chartInstance = useRef(null);

        // Financial Mechanics
        const totalActualCollected = Number(cashDrawer) + Number(visaInsta);
        const theoreticalDifference = Number(systemSales) - (totalActualCollected + Number(expenses));
        const netProfitAfterLeaks = Number(systemSales) - Number(expenses) - Number(rawWastage) - (theoreticalDifference > 0 ? theoreticalDifference : 0);
        const fraudScore = theoreticalDifference > 2000 || voidCount > 15 ? 98 : 20;

        // authentication logic
        const handleLogin = () => {
            const cleanCode = pinCode.trim().toUpperCase();
            if (VALID_LICENSES[cleanCode]) {
                setAuth(true);
                setUserBranch(VALID_LICENSES[cleanCode]);
                setUserLicenseKey(cleanCode);
                setTimeout(() => lucide.createIcons(), 200);
            } else {
                alert('⚠️ كود التفعيل غير صحيح أو منتهي الصلاحية! بركاء أدخل الكود المخصص لترخيصك الـ VIP.');
            }
        };

        useEffect(() => {
            if (auth && activeTab === 'analytics' && chartRef.current) {
                if (chartInstance.current) chartInstance.current.destroy();
                const ctx = chartRef.current.getContext('2d');
                chartInstance.current = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: ['مبيعات السيستم', 'المقبوضات الفعلية', 'المصاريف', 'الهالك الخفي', 'العجز التسريبي'],
                        datasets: [{
                            label: 'القيمة بالجنيه (EGP)',
                            data: [systemSales, totalActualCollected, expenses, rawWastage, theoreticalDifference > 0 ? theoreticalDifference : 0],
                            backgroundColor: ['#00F0FF', '#10B981', '#F59E0B', '#A855F7', '#FF2E93'],
                            borderRadius: 12
                        }]
                    },
                    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { grid: { color: 'rgba(255,255,255,0.05)' }, ticks: { color: '#9CA3AF' } }, x: { grid: { display: false }, ticks: { color: '#9CA3AF' } } } }
                });
            }
        }, [auth, activeTab, systemSales, cashDrawer, visaInsta,expenses, theoreticalDifference, rawWastage]);

        const handleConfetti = () => { confetti({ particleCount: 150, spread: 80, origin: { y: 0.6 } }); };

        if (!auth) {
            return (
                <div className="flex items-center justify-center min-h-screen px-4 scanline">
                    <div className="glass-panel p-10 rounded-3xl max-w-lg w-full text-center border border-cyan-500/30 glow-cyan relative overflow-hidden">
                        <div className="absolute -top-12 -right-12 w-32 h-32 bg-cyan-500/10 rounded-full blur-2xl"></div>
                        <div className="w-24 h-24 bg-cyan-950/80 rounded-2xl border-2 border-cyan-400 flex items-center justify-center mx-auto mb-6 glow-cyan radar-anim">
                            <i data-lucide="shield-alert" className="w-12 h-12 text-cyan-400"></i>
                        </div>
                        <h1 className="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-gold to-emerald-400 mb-1 font-tech tracking-wider">VAULT SENTINEL AI</h1>
                        <p className="text-xs text-slate-400 mb-8 tracking-widest uppercase">منظومة رادار كشف الاختلاس والسرقة الذكية v2026 - للفئة الـ VIP</p>
                        
                        <div className="space-y-4">
                            <input 
                                type="text" 
                                placeholder="أدخل كود التفعيل والترخيص المشفر (مثال: VIP-2026-...)"
                                className="w-full py-4 px-6 rounded-xl bg-slate-950/80 border border-slate-700 text-center font-tech text-lg tracking-wider text-cyan-300 focus:border-cyan-400 focus:glow-cyan outline-none transition uppercase"
                                value={pinCode}
                                onChange={(e) => setPinCode(e.target.value)}
                            />
                            <button 
                                onClick={handleLogin}
                                className="w-full py-4 bg-gradient-to-r from-cyan-500 via-teal-500 to-emerald-500 text-slate-950 font-black text-lg rounded-xl shadow-xl hover:brightness-125 transition active:scale-95 flex items-center justify-center gap-2"
                            >
                                <i data-lucide="key" className="w-5 h-5"></i> تفعيل الترخيص والربط الذكي
                            </button>
                        </div>
                    </div>
                </div>
            );
        }

        return (
            <div className="max-w-7xl mx-auto p-4 md:p-8 space-y-8 min-h-screen">
                {/* Header */}
                <header className="glass-panel p-6 rounded-3xl border border-slate-800 flex flex-col lg:flex-row items-center justify-between gap-6 glow-cyan">
                    <div className="flex items-center gap-4">
                        <div className="p-4 bg-cyan-500/10 border border-cyan-400/40 rounded-2xl glow-cyan"><i data-lucide="radar" className="w-10 h-10 text-cyan-400 animate-spin" style={{ animationDuration: '10s' }}></i></div>
                        <div>
                            <div className="flex items-center gap-2">
                                <h1 className="text-2xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-emerald-400 to-gold">رقيب الخزنة الذكي PRO</h1>
                                <span className="bg-emerald-500/20 text-emerald-300 text-[10px] px-2.5 py-1 rounded-full border border-emerald-500/40 font-tech uppercase">LICENSE: {userBranch}</span>
                            </div>
                            <p className="text-xs text-slate-400 mt-1">نظام غرفة العمليات لمراقبة المحل والثغرات - الفرع: <span className="text-emerald-400 font-bold">{userBranch}</span></p>
                        </div>
                    </div>
                    <div className="flex flex-wrap bg-slate-950/80 p-1.5 rounded-2xl border border-slate-800">
                        <button onClick={() => setActiveTab('radar')} className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${activeTab === 'radar' ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 glow-cyan' : 'text-slate-400 hover:text-white'}`}><i data-lucide="shield-alert" className="w-4 h-4"></i> رادار الاختلاس</button>
                        <button onClick={() => setActiveTab('integrations')} className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${activeTab === 'integrations' ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 glow-cyan' : 'text-slate-400 hover:text-white'}`}><i data-lucide="blocks" className="w-4 h-4"></i> الربط الذكي</button>
                        <button onClick={() => setActiveTab('shift')} className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${activeTab === 'shift' ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 glow-cyan' : 'text-slate-400 hover:text-white'}`}><i data-lucide="user-x" className="w-4 h-4"></i> ثغرات الكاشير</button>
                        <button onClick={() => setActiveTab('analytics')} className={`px-4 py-2.5 rounded-xl text-xs font-bold transition flex items-center gap-2 ${activeTab === 'analytics' ? 'bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 glow-cyan' : 'text-slate-400 hover:text-white'}`}><i data-lucide="bar-chart-3" className="w-4 h-4"></i> الرسوم البيانية</button>
                    </div>
                </header>

                {/* TAB 1: AI FRAUD RADAR */}
                {activeTab === 'radar' && (
                    <div className="space-y-8">
                        {/* KPI Cards */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                            <div className={`glass-panel p-6 rounded-3xl border-t-4 ${theoreticalDifference > 1000 ? 'border-pink-500 glow-crimson' : 'border-emerald-500 glow-emerald'}`}>
                                <h3 className={`text-3xl font-black font-tech ${theoreticalDifference > 1000 ? 'text-pink-500' : 'text-emerald-400'}`}>{theoreticalDifference > 0 ? `-${theoreticalDifference} EGP` : 'لا يوجد عجز ✨'}</h3>
                                <p className="text-[11px] text-slate-400 mt-2">العجز المالي غير المبرر (تسريب ناعم)</p>
                            </div>
                            <div className="glass-panel p-6 rounded-3xl border-t-4 border-emerald-400 glow-emerald">
                                <h3 className="text-3xl font-black text-emerald-400 font-tech">{netProfitAfterLeaks} EGP</h3>
                                <p className="text-[11px] text-slate-400 mt-2">صافي الأرباح الحقيقية والنهائية</p>
                                <button onClick={handleConfetti} className="text-[10px] text-emerald-300 underline mt-2 hover:text-emerald-200">اضغط للتحقق 🎉</button>
                            </div>
                            <div className="glass-panel p-6 rounded-3xl border-t-4 border-amber-400 glow-gold relative">
                                <div className={`w-3 h-3 rounded-full absolute top-6 right-6 ${fraudScore > 80 ? 'bg-pink-500 glow-crimson pulse-indicator' : 'bg-emerald-400 glow-emerald'}`}></div>
                                <h3 className="text-3xl font-black text-amber-400 font-tech">{fraudScore}%</h3>
                                <p className="text-[11px] text-slate-400 mt-2">مؤشر خطر السرقة/التسريب (AI)</p>
                            </div>
                            <div className="glass-panel p-6 rounded-3xl border-t-4 border-cyan-400 glow-cyan">
                                <h3 className="text-3xl font-black text-cyan-400 font-tech">{totalActualCollected} EGP</h3>
                                <p className="text-[11px] text-slate-400 mt-2">إجمالي الكاش و InstaPay الفعلي</p>
                            </div>
                        </div>

                        {/* AI Audit */}
                        <div className="glass-panel p-8 rounded-3xl border border-slate-800 space-y-6">
                            <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                                <h3 className="text-lg font-bold text-cyan-400 flex items-center gap-3"><i data-lucide="scan-eye" className="text-cyan-400"></i> رادار تحليل السلوكيات المشبوهة للوردية والمدير (AI Audit)</h3>
                                <span className="text-xs text-slate-500 font-tech uppercase">RESPONSIBLE: {shiftCashier}</span>
                            </div>
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div className="p-4 rounded-xl bg-slate-950/70 border border-slate-800 flex items-center justify-between hover:border-pink-500/50 transition">
                                    <h4 className="text-sm font-bold text-slate-200 flex items-center gap-3"><i data-lucide="file-x-2" className="text-pink-400"></i> الفواتير الملغاة بعد الطباعة (Void Receipts)</h4>
                                    <span className={`text-sm font-bold font-tech px-3 py-1 rounded-lg ${voidCount > 20 ? 'bg-pink-500/20 text-pink-400 border border-pink-500/40' : 'text-emerald-400'}`}>{voidCount} فاتورة</span>
                                </div>
                                <div className="p-4 rounded-xl bg-slate-950/70 border border-slate-800 flex items-center justify-between hover:border-amber-500/50 transition">
                                    <h4 className="text-sm font-bold text-slate-200 flex items-center gap-3"><i data-lucide="key-round" className="text-amber-400"></i> فتح درج الخزنة بدون عملية بيع (Manual No Sale)</h4>
                                    <span className={`text-sm font-bold font-tech px-3 py-1 rounded-lg ${manualNoSaleOpenCount > 15 ? 'bg-amber-500/20 text-amber-400 border border-amber-500/40' : 'text-emerald-400'}`}>{manualNoSaleOpenCount} فتحة</span>
                                </div>
                            </div>
                        </div>
                    </div>
                )}

                {/* TAB 2: EASY INTEGRATIONS (RAHA NAFSIYA) */}
                {activeTab === 'integrations' && (
                    <div className="glass-panel p-8 rounded-3xl border border-slate-800 space-y-8">
                        <div className="flex items-center justify-between border-b border-slate-800 pb-4">
                            <div>
                                <h3 className="text-xl font-bold text-cyan-400 flex items-center gap-3"><i data-lucide="blocks"></i> مركز الربط الذكي السلس مع الأنظمة (No-Code Integration)</h3>
                                <p className="text-xs text-slate-400 mt-1">اربط سيستم الكاشير والمخزون بضغطة زر وبدون مبرمج - لراحة بالك النفسية</p>
                            </div>
                            <span className={`flex items-center gap-2 text-xs px-3 py-1.5 rounded-full ${posConnected ? 'bg-emerald-500/20 text-emerald-300' : 'bg-pink-500/20 text-pink-300'}`}>
                                <i data-lucide={posConnected ? "check-circle" : "alert-triangle"} className="w-4 h-4"></i>
                                {posConnected ? "النظام متصل ويعمل" : "في انتظار الربط الذكي"}
                            </span>
                        </div>

                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                            {/* POS Integration */}
                            <div className="bg-slate-950/70 p-7 rounded-2xl border border-slate-800 space-y-5">
                                <h4 className="font-bold text-white flex items-center gap-3"><i data-lucide="clapperboard" className="text-cyan-400"></i> ربط سيستم الكاشير (POS) آلياً</h4>
                                <select value={selectedPos} onChange={e => setSelectedPos(e.target.value)} className="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl text-slate-200 outline-none focus:border-cyan-400">
                                    <option value="none">اختيار نوع السيستم وبدء السحر...</option>
                                    <option value="foodics">Foodics (فوديكس) - الربط الذكي</option>
                                    <option value="odoo">Odoo (أودو) - الربط الذكي</option>
                                    <option value="quickbooks">QuickBooks - الربط الذكي</option>
                                    <option value="custom">سيستم محلي (API Integration)</option>
                                </select>
                                <input type="password" placeholder="أدخل مفتاح الـ API (API Key) من السيستم بتاعك بضغطة زر" className="w-full p-4 bg-slate-900 border border-slate-700 rounded-xl text-cyan-300 outline-none focus:border-cyan-400 uppercase font-tech tracking-wider text-sm" />
                                <button onClick={() => selectedPos !== 'none' && setPosConnected(true)} className="w-full py-4 bg-gradient-to-r from-cyan-500 to-blue-600 text-slate-950 font-black rounded-xl hover:brightness-110 transition active:scale-95 flex items-center justify-center gap-2">
                                    <i data-lucide="cpu"></i> تنفيذ الربط الذكي وسحب البيانات
                                </button>
                                {posConnected && <p className="text-xs text-emerald-400 text-center font-tech uppercase">✔ AUTO-CONNECTED TO FOODICS API V3</p>}
                            </div>
                            <div className="flex flex-col items-center justify-center text-center p-8 border border-slate-800 rounded-2xl bg-slate-950/40">
                                <i data-lucide="shield-check" className="w-20 h-20 text-emerald-400 opacity-60 mb-6 glow-emerald"></i>
                                <h4 className="font-bold text-white mb-2">منظومة الربط الآلي للفئة الـ VIP</h4>
                                <p className="text-xs text-slate-400 leading-relaxed max-w-xs">نحن هنا لضمان راحتك. يتم ربط أنظمتك بضغطة زر وبدون كتابة أي كود، لنبدأ بمراقبة التسريب المالي فوراً.</p>
                            </div>
                        </div>
                    </div>
                )}

                {/* Other tabs remain hidden or placeholder for now to ensure smoothness */}
                {activeTab === 'inputs' && (<div className="glass-panel p-8 rounded-3xl border border-slate-800 text-slate-500">خانات مدخلات الوردية (محجوبة لو تم الربط الآلي).</div>)}
                {activeTab === 'shift' && (<div className="glass-panel p-8 rounded-3xl border border-slate-800 text-slate-500">ثغرات الكاشير المفصلة.</div>)}
                {activeTab === 'analytics' && (<div className="glass-panel p-8 rounded-3xl border border-slate-800 space-y-6"><h3 className="text-xl font-bold text-cyan-400 flex items-center gap-3"><i data-lucide="bar-chart-2"></i> الرسوم البيانية لتفكيك الأموال والمصروفات</h3><canvas ref={chartRef} className="max-h-96 w-full"></canvas></div>)}
            </div>
        );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
    setTimeout(() => lucide.createIcons(), 300);
</script>
</body>
</html>
